<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn Piano</title>
<meta name="description" content="Play the piano, get the notes. Score or falling notes, in the browser (Basic Pitch).">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#121418">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* Layout: the notes fill the page; one slim bar of symbols on top, settings tucked behind a gear. */
:root {
  --paper: #f8f7f3; --ink: #1d1c1a; --muted: #8a857c; --line: #dedad1; --key: #2f5d8a; --rec: #b3261e; --bar: #ffffffd9;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #121418; --ink: #ebe8e1; --muted: #8d887f; --line: #2c3036; --key: #8db4dc; --rec: #ef6b62; --bar: #121418d9; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; }
.bar {
  position: sticky; top: 0; z-index: 2; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  padding: 10px max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px));
  background: var(--bar); backdrop-filter: blur(6px);
}
.bar button, .bar .file, .bar summary {
  width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: transparent; color: var(--ink);
  font-size: 17px; cursor: pointer; display: inline-grid; place-items: center; list-style: none; position: relative;
}
.bar summary::-webkit-details-marker { display: none; }
.bar button:hover, .bar .file:hover, .bar summary:hover { border-color: var(--key); }
.bar button:focus-visible, .bar summary:focus-visible, .file:focus-within { outline: 2px solid var(--key); outline-offset: 2px; }
.bar button:disabled { opacity: .35; cursor: default; }
#rec { color: var(--rec); }
#rec.recording { background: var(--rec); color: #fff; border-color: var(--rec); }
.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.sep { width: 1px; height: 24px; background: var(--line); margin: 0 4px; }
.view { display: inline-flex; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.view button { border: 0; border-radius: 0; width: auto; padding: 0 12px; font-size: 13px; }
.view button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.status { margin-left: auto; font: 12px ui-monospace, monospace; color: var(--muted); max-width: 40ch; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--key); width: 0; transition: width .2s; }
details.set { position: relative; }
.set .pane {
  position: absolute; top: 48px; left: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
  padding: 12px; display: grid; gap: 10px; width: 230px; font-size: 12px; color: var(--muted); z-index: 3;
}
.set label { display: grid; gap: 2px; }
.set output { color: var(--ink); font-family: ui-monospace, monospace; }
input[type=range] { accent-color: var(--key); width: 100%; }
#sheet { flex: 1; overflow: auto; padding: 8px max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px)); }
#sheet svg path, #sheet svg text { fill: var(--ink); }
#fall { flex: 1; width: 100%; min-height: 0; display: block; background: #07090d; }
.only-fall { display: none; }
body.falling .only-fall { display: inline-grid; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="Controls">
  <button id="rec" type="button" title="Record" aria-label="Record">●</button>
  <label class="file" for="file" title="Upload a recording" aria-label="Upload a recording">↑<input id="file" type="file" accept="audio/*"></label>
  <label class="file" for="midiIn" title="Open a MIDI file" aria-label="Open a MIDI file">♪<input id="midiIn" type="file" accept=".mid,.midi,audio/midi"></label>
  <span class="sep" aria-hidden="true"></span>
  <button id="play" type="button" title="Play the notes" aria-label="Play the notes" disabled>▶</button>
  <button id="pRestart" class="only-fall" type="button" title="Back to the start" aria-label="Back to the start">⏮</button>
  <button id="sound" class="only-fall" type="button" title="Sound on (learn) / off (practice)" aria-label="Sound on" aria-pressed="true">🔊</button>
  <button id="midi" type="button" title="Download MIDI" aria-label="Download MIDI" disabled>⬇</button>
  <span class="sep" aria-hidden="true"></span>
  <div class="view" role="group" aria-label="View">
    <button id="vScore" type="button" aria-pressed="true">Score</button>
    <button id="vFall" type="button" aria-pressed="false">Falling</button>
    <button id="vPiano" type="button" aria-pressed="false">Piano</button>
  </div>
  <details class="set">
    <summary title="Settings" aria-label="Settings">⚙</summary>
    <div class="pane">
      <label for="bpm">Tempo <output id="bpmOut">90 BPM</output><input id="bpm" type="range" min="40" max="180" value="90"></label>
      <label for="sens">Sensitivity <output id="sensOut">medium</output><input id="sens" type="range" min="1" max="5" value="3"></label>
      <label for="minlen">Shortest note <output id="minlenOut">120 ms</output><input id="minlen" type="range" min="40" max="300" step="20" value="120"></label>
      <label for="speed">Speed <output id="speedOut">100 %</output><input id="speed" type="range" min="25" max="150" step="5" value="100"></label>
      <label for="ahead">Look ahead <output id="aheadOut">3 s</output><input id="ahead" type="range" min="1" max="8" step="0.5" value="3"></label>
    </div>
  </details>
  <span class="status" id="status" role="status">loading…</span>
  <i class="progress" id="progress" aria-hidden="true"></i>
</div>
<div id="sheet" aria-label="Score"></div>
<canvas id="fall" aria-label="Falling notes over a keyboard" hidden></canvas>
<script src="https://cdn.jsdelivr.net/npm/abcjs@6.4.4/dist/abcjs-basic-min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
